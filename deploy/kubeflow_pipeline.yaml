components:
  ingest_data:
    description: "Load raw CSV, compute SHA-256 hash, emit dataset metadata."
    cmd: python src/data/ingestion.py
    resources:
      cpu: "0.5"
      memory: "512Mi"
    inputs:
      - name: raw_data_path
        type: String
      - name: random_state
        type: Integer
    outputs:
      - name: metadata_path
        type: Dataset

  validate_data:
    description: "Schema validation, duplicate check, class balance check."
    cmd: python src/data/validation.py
    resources:
      cpu: "0.5"
      memory: "512Mi"
    inputs:
      - name: raw_data_path
        type: String
      - name: metadata_path
        type: Dataset
    outputs:
      - name: validation_report_path
        type: Dataset

  clean_data:
    description: "Deterministic imputation, target encoding, customerID drop."
    cmd: python src/data/cleaning.py
    resources:
      cpu: "0.5"
      memory: "512Mi"
    inputs:
      - name: raw_data_path
        type: String
      - name: validation_report_path
        type: Dataset
    outputs:
      - name: clean_data_path
        type: Dataset
      - name: cleaning_log_path
        type: Dataset

  engineer_features:
    description: "Apply DomainFeatureEngineer to compute 7 domain features."
    cmd: python src/features/engineering.py
    resources:
      cpu: "1"
      memory: "1Gi"
    inputs:
      - name: clean_data_path
        type: Dataset
    outputs:
      - name: engineered_data_path
        type: Dataset
      - name: feature_report_path
        type: Dataset

  split_data:
    description: "Stratified 80/20 train/test split with 5-fold CV indices."
    cmd: python src/data/split.py
    resources:
      cpu: "0.5"
      memory: "512Mi"
    inputs:
      - name: clean_data_path
        type: Dataset
      - name: test_size
        type: Float
      - name: random_state
        type: Integer
    outputs:
      - name: train_path
        type: Dataset
      - name: test_path
        type: Dataset
      - name: cv_folds_path
        type: Dataset

  preprocess:
    description: "Fit ColumnTransformer on train only; serialize preprocessor.joblib."
    cmd: python src/data/preprocessing.py
    resources:
      cpu: "1"
      memory: "1Gi"
    inputs:
      - name: train_path
        type: Dataset
    outputs:
      - name: preprocessor_path
        type: Model
      - name: preprocessing_report_path
        type: Dataset

  train_baseline:
    description: "5-fold CV evaluation of Dummy, LR, RF, XGBoost baselines."
    cmd: python src/models/train.py
    resources:
      cpu: "4"
      memory: "4Gi"
    inputs:
      - name: train_path
        type: Dataset
      - name: cv_folds_path
        type: Dataset
    outputs:
      - name: baseline_cv_results_path
        type: Dataset
      - name: baseline_summary_path
        type: Dataset

  hyperparameter_optimization:
    description: "RandomizedSearchCV (n_iter=30) for LR, RF, XGBoost."
    cmd: python src/models/tune.py
    resources:
      cpu: "8"
      memory: "8Gi"
    inputs:
      - name: train_path
        type: Dataset
      - name: cv_folds_path
        type: Dataset
      - name: diagnosis_report_path
        type: Dataset
    outputs:
      - name: tuned_lr_path
        type: Model
      - name: tuned_rf_path
        type: Model
      - name: tuned_xgb_path
        type: Model
      - name: tuning_report_path
        type: Dataset

  evaluate_champion:
    description: "First and only unlock of test.csv; evaluate champion XGBoost."
    cmd: python src/models/evaluate.py
    resources:
      cpu: "2"
      memory: "2Gi"
    inputs:
      - name: test_path
        type: Dataset
      - name: tuned_xgb_path
        type: Model
    outputs:
      - name: champion_model_path
        type: Model
      - name: champion_metadata_path
        type: Dataset
      - name: evaluation_report_path
        type: Dataset

  track_mlflow:
    description: "Log all 10 experiment runs to MLflow with metrics and artifacts."
    cmd: python src/models/track_mlflow.py
    resources:
      cpu: "1"
      memory: "1Gi"
    inputs:
      - name: champion_model_path
        type: Model
      - name: evaluation_report_path
        type: Dataset
    outputs:
      - name: mlflow_summary_path
        type: Dataset

pipeline:
  name: churnops_training_pipeline
  description: "End-to-end MLOps training pipeline for Telco Churn prediction"
  version: 1.0.0

  dag:
    edges:
      - from: ingest_data
        to: validate_data
      - from: validate_data
        to: clean_data
      - from: clean_data
        to: engineer_features
      - from: clean_data
        to: split_data
      - from: engineer_features
        to: preprocess
      - from: split_data
        to: preprocess
      - from: split_data
        to: train_baseline
      - from: preprocess
        to: train_baseline
      - from: train_baseline
        to: hyperparameter_optimization
      - from: hyperparameter_optimization
        to: evaluate_champion
      - from: evaluate_champion
        to: track_mlflow

  runtime_config:
    gcs_root_uri: gs://your-bucket/churnops-pipelines
    parameters:
      random_state: 42
      test_size: 0.20
      cv_folds: 5
      min_f1: 0.60
      min_roc_auc: 0.75
      min_recall: 0.60