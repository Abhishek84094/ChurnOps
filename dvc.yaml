stages:
  ingest:
    cmd: python src/data/ingestion.py
    deps:
      - src/data/ingestion.py
      - src/utils/config.py
      - src/utils/logging.py
      - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
    params:
      - params.yaml:
          - paths
          - dataset
    outs:
      - reports/dataset_metadata.json:
          cache: false

  validate:
    cmd: python src/data/validation.py
    deps:
      - src/data/validation.py
      - src/utils/config.py
      - src/utils/logging.py
      - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
      - reports/dataset_metadata.json
    params:
      - params.yaml:
          - paths
          - dataset
    outs:
      - reports/validation_report.json:
          cache: false

  eda:
    cmd: python src/data/eda.py
    deps:
      - src/data/eda.py
      - src/utils/config.py
      - src/utils/logging.py
      - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
      - reports/validation_report.json
    params:
      - params.yaml:
          - paths
          - dataset
    outs:
      - reports/eda/eda_summary.json:
          cache: false
      - reports/eda/01_target_distribution.png:
          cache: false
      - reports/eda/02_numeric_distributions.png:
          cache: false
      - reports/eda/03_cramers_v_ranking.png:
          cache: false
      - reports/eda/04_bivariate_key_drivers.png:
          cache: false
      - reports/eda/05_numeric_correlation_matrix.png:
          cache: false

  clean:
    cmd: python src/data/cleaning.py
    deps:
      - src/data/cleaning.py
      - src/utils/config.py
      - src/utils/logging.py
      - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
      - reports/eda/eda_summary.json
    params:
      - params.yaml:
          - paths
          - dataset
    outs:
      - data/interim/telco_clean.csv
      - reports/cleaning_log.json:
          cache: false

  engineer_features:
    cmd: python src/features/engineering.py
    deps:
      - src/features/engineering.py
      - src/utils/config.py
      - src/utils/logging.py
      - data/interim/telco_clean.csv
    params:
      - params.yaml:
          - paths
          - features
    outs:
      - data/interim/telco_engineered.csv
      - reports/feature_engineering_report.json:
          cache: false

  select_features:
    cmd: python src/features/selection.py
    deps:
      - src/features/selection.py
      - src/utils/config.py
      - src/utils/logging.py
      - data/interim/telco_engineered.csv
    params:
      - params.yaml:
          - paths
          - dataset
    outs:
      - reports/feature_selection_report.json:
          cache: false
      - reports/feature_selection/01_mutual_information.png:
          cache: false
      - reports/feature_selection/02_vif_and_correlation.png:
          cache: false
      - reports/feature_selection/03_model_importances.png:
          cache: false
      - reports/feature_selection/04_shap_summary.png:
          cache: false

  split:
    cmd: python src/data/split.py
    deps:
      - src/data/split.py
      - src/utils/config.py
      - src/utils/logging.py
      - data/interim/telco_clean.csv
    params:
      - params.yaml:
          - paths
          - split
          - cv
          - random_state
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/cv_folds.json
      - reports/split_report.json:
          cache: false
      - reports/split_distribution.png:
          cache: false

  preprocess:
    cmd: python src/data/preprocessing.py
    deps:
      - src/data/preprocessing.py
      - src/features/engineering.py
      - src/utils/config.py
      - src/utils/logging.py
      - data/processed/train.csv
    params:
      - params.yaml:
          - paths
          - preprocessing
    outs:
      - models/preprocessor.joblib
      - reports/preprocessing_report.json:
          cache: false






